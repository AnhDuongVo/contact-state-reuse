# Experiment E (v0.2): factorial objective x force design on a FIXED TRUNK.
# Every condition uses the same network (PredictiveContactWorldModel class,
# hidden 66: same encoder, GRU and heads); conditions differ only in which
# losses are switched on, whether force is an input, and the training data.
# Primary comparisons train every loss on successful demonstrations only
# (train.episode_filter: success), so all objectives see identical data.
experiment: E_factorial
kind: conditions
output_root: outputs
seeds: [0, 1, 2, 3, 4]
data:
  dir: data/experiments
  n_train: 300
  seed: 0
  p_perturbed: 0.2
  dart_sigma: 0.1
model_defaults:
  kind: world_model
  hidden: 66
  param_budget: 0
  core: gru
  lambda_obs: 0.0
  lambda_force: 0.0
  modalities: [extero, proprio, force]
train:
  steps: 1500
  batch_episodes: 16
  lr: 0.001
  log_every: 100
  episode_filter: success
conditions:
  # ---- 2 x 2 x 2 factorial: observation prediction x force input x force target
  - {name: bc, model: {modalities: [extero, proprio]}}
  - {name: bc_F, model: {}}
  - {name: ftgt, model: {lambda_force: 1.0, modalities: [extero, proprio]}}
  - {name: F_ftgt, model: {lambda_force: 1.0}}
  - {name: obs, model: {lambda_obs: 1.0, modalities: [extero, proprio]}}
  - {name: obs_F, model: {lambda_obs: 1.0}}
  - {name: obs_ftgt, model: {lambda_obs: 1.0, lambda_force: 1.0, modalities: [extero, proprio]}}
  - {name: obs_F_ftgt, model: {lambda_obs: 1.0, lambda_force: 1.0},
     eval_corruptions: [{mode: delay, delay: 4}, {mode: bias, magnitude: 3.0}, {mode: noise, magnitude: 3.0}]}
  # ---- failure exposure: auxiliary losses also see failed / high-force episodes
  - {name: bc_F_alldata, model: {}, train: {episode_filter: all}}
  - {name: obs_F_alldata, model: {lambda_obs: 1.0}, train: {episode_filter: all}}
  - {name: obs_F_ftgt_alldata, model: {lambda_obs: 1.0, lambda_force: 1.0}, train: {episode_filter: all}}
  # ---- auxiliary-loss controls
  - {name: recon_F, model: {lambda_recon: 1.0}}
  # stop-gradient: the heads are trained but cannot shape the shared latent (close to BC by construction;
  # checks that the extra heads and losses have no side effect)
  - {name: obs_F_ftgt_stopgrad, model: {lambda_obs: 1.0, lambda_force: 1.0, aux_stopgrad: true}}
  # separate core: prediction heads read their own GRU that shares only the encoder with the policy,
  # so the action head never reads the predictive latent
  - {name: obs_F_ftgt_sepcore, model: {lambda_obs: 1.0, lambda_force: 1.0, aux_core: true}}
  - {name: obs_F_ftgt_w0.1, model: {lambda_obs: 0.1, lambda_force: 0.1}}
  - {name: obs_F_ftgt_w0.3, model: {lambda_obs: 0.3, lambda_force: 0.3}}
  - {name: obs_F_ftgt_w3, model: {lambda_obs: 3.0, lambda_force: 3.0}}
  # ---- fault-aware training (sensor-fault model added to a copy of every episode)
  - {name: obs_F_ftgt_aug, model: {lambda_obs: 1.0, lambda_force: 1.0}, train: {force_aug: 1.0},
     eval_corruptions: [{mode: delay, delay: 4}, {mode: bias, magnitude: 3.0}, {mode: noise, magnitude: 3.0}]}
  - {name: bc_F_aug, model: {}, train: {force_aug: 1.0},
     eval_corruptions: [{mode: delay, delay: 4}, {mode: bias, magnitude: 3.0}, {mode: noise, magnitude: 3.0}]}
  # ---- behaviour-cloning diagnostics
  - {name: bc_F_lr3e-4, model: {}, train: {lr: 0.0003}}
  - {name: bc_F_lr1e-4, model: {}, train: {lr: 0.0001}}
  # the same learning rate for the comparison conditions (a tuned baseline needs a tuned comparison)
  - {name: bc_lr3e-4, model: {modalities: [extero, proprio]}, train: {lr: 0.0003}}
  - {name: obs_ftgt_lr3e-4, model: {lambda_obs: 1.0, lambda_force: 1.0, modalities: [extero, proprio]}, train: {lr: 0.0003}}
  - {name: obs_F_ftgt_lr3e-4, model: {lambda_obs: 1.0, lambda_force: 1.0}, train: {lr: 0.0003}}
  - {name: bc_F_long, model: {}, train: {steps: 3000}}
  - {name: bc_F_noprev, model: {use_prev_action: false}}
  - {name: bc_noprev, model: {use_prev_action: false, modalities: [extero, proprio]}}
  - {name: obs_F_ftgt_noprev, model: {lambda_obs: 1.0, lambda_force: 1.0, use_prev_action: false}}
  - {name: bc_F_log, model: {force_transform: log}}
  - {name: bc_F_binary, model: {force_transform: binary}}
  - {name: bc_F_dart0, model: {}, data: {dart_sigma: 0.0}}
  - {name: bc_dart0, model: {modalities: [extero, proprio]}, data: {dart_sigma: 0.0}}
  - {name: bc_F_wide, model: {hidden: 94}}
eval:
  domains: [source, shifted_friction, tight_clearance, sensor_noise, occlusion]
  n_episodes: 50
  seed: 123
  contact_auroc: true
medium: {}
quick:
  seeds: [0]
  data: {n_train: 60}
  train: {steps: 40, log_every: 20}
  eval: {n_episodes: 4, domains: [source, sensor_noise]}
