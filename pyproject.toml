[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-state-reuse"
version = "0.1.0"
description = "Predictive force-aware world models and contact-state representation reuse in simulated insertion"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maria (Anh Duong Vo)", email = "anhduongvo.m@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "gymnasium>=0.29",
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pre-commit>=3.5"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer end-to-end tests (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*deterministic.*:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["B905", "SIM108", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["contact_state_reuse"]
