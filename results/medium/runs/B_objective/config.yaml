experiment: B_objective
kind: conditions
output_root: outputs
seeds:
- 0
- 1
- 2
data:
  dir: data/experiments
  n_train: 300
  seed: 0
  p_perturbed: 0.2
  dart_sigma: 0.1
model_defaults:
  param_budget: 60000
  core: gru
  modalities:
  - extero
  - proprio
  - force
train:
  steps: 1500
  batch_episodes: 16
  lr: 0.001
  log_every: 250
conditions:
- name: sequence_bc
  model:
    kind: sequence
- name: wm_obs
  model:
    kind: world_model
    lambda_obs: 1.0
    lambda_force: 0.0
- name: wm_obs_force
  model:
    kind: world_model
    lambda_obs: 1.0
    lambda_force: 1.0
- name: wm_obs_force_contactsup
  model:
    kind: world_model
    lambda_obs: 1.0
    lambda_force: 1.0
    lambda_contact: 0.5
    contact_supervision: true
comparisons:
- - wm_obs
  - sequence_bc
- - wm_obs_force
  - wm_obs
- - wm_obs_force_contactsup
  - wm_obs_force
eval:
  domains:
  - source
  - shifted_friction
  - tight_clearance
  - sensor_noise
  - occlusion
  n_episodes: 50
  seed: 123
  contact_auroc: true
_scale: medium
_source: configs/experiments/B_objective.yaml
